  </head>

    <nav>
      <ul>

          </ul>

    <section>

      <h2 class="titulo">Cadastro</h2>

      <!--Formulário-->
      <div class="FormBox">
        <form method="post" action="#">
          <br>
          <!--Primeiro campo-->
          <fieldset class="FSLinhaInteira">
          
            <legend>identificação</legend>
            
            <div>
              <!--campo do email-->
              <div class="LinhaForm">
                <label class="LabBox" for="idEmail">Email:</label>
                <input class="InpBoxGnd" id="emailCad" name="email" type="email">
              </div>
              
              <div class="LinhaForm">
                <!--campo da senha-->
                <div class="ColEsq">
                  <label class="LabBox" for="senhaNova">Senha:</label>
                  <input class="InpBoxMed" id="senhaNova" name="Senha" type="password">
                </div>
  
                <!--campo confirme senha-->
                <div class="ColDir">
                  <label class="LabBox" for="confirme">Confirme:</label>
                  <input class="InpBoxMed" id="confirme" name="Confirme"type="password">
                </div>
              </div>

            </div>

          </fieldset>

          <!--Segundo campo-->
          <fieldset class="FSLinhaInteira">
            <legend>Dados Pessoais</legend>

            <!--campo nome-->
            <div class="LinhaForm">
                <label class="LabBox" for="nome">Nome:</label>
                <input class="InpBoxGnd" name="Nome" type="name">
            </div>

            <!--campo endereço-->
            <div class="LinhaForm" id="linhaEnder">
              <label class="LabBox" for="inpEnder">Endereço:</label>
              <textarea
              class="InpBoxGnd" id="inpEnder" name="endereco" readonly></textarea>
            </div>

            <div class="LinhaForm">
              <!--campo do telefone-->
                <div class="ColEsq">
                  <label class="LabBox" for="telefone">Telefone:</label>
                  <input class="InpBoxMed" id="telefone" name="Telefone" type="tel">
                </div>
  
                <!--campo celular-->
                <div class="ColDir">
                  <label class="LabBox" for="celular">Celular:</label>
                  <input class="InpBoxMed" id="celular" name="Celular" type="tel">
                </div>
            </div>

            <!--campo nascimento-->
            <fieldset class="FSColEsq" id="nasc">
              <legend>Nascimento:</legend>

                <input class="numDD" name="dia" type="number" min="1" max="31"> /

                <input class="numDD" name="mes" type="number" min="1" max="12"> /
    
                <input class="numQD" name="ano" type="number" min="2026" max="2050">
             
            </fieldset>
            
            <!--campo sexo-->
            <fieldset class="FSColDir" id="sexo">
              <legend>Sexo</legend>
              <label><input type="radio" name="sexo" value="mas" >Mas</label><br>
  
              <label><input type="radio" name="sexo" value="fem">Fem</label><br>
  
              <label><input type="radio" name="sexo" value="outro" checked>Outro</label>
            </fieldset>
          </fieldset> 
          
          <!--Botões finais-->
          <div class="botoes">
            <input type="submit" value="Confirmar">
            <input type="reset" value="Limpar">
          </div>

        </form>

      </div>
      
    </section>
  </body>
</html>
